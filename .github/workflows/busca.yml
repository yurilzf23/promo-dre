name: Promo Dre busca

# O site abre uma issue "Buscar: <termo>" ou "Monitorar: <url> | <termo>".
# Só pedidos do dono do repositório são atendidos.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: promo-dre-busca
  cancel-in-progress: false

jobs:
  atender:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'Buscar:') || startsWith(github.event.issue.title, 'Monitorar:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Atender pedido
        id: pedido
        env:
          TITULO: ${{ github.event.issue.title }}
        run: python -m promodre.busca "$TITULO" || echo "falhou=1" >> "$GITHUB_OUTPUT"

      - name: Salvar
        run: |
          git config user.name "promo-dre-bot"
          git config user.email "promo-dre-bot@users.noreply.github.com"
          for tentativa in 1 2 3; do
            git add docs/buscas.json produtos.yaml
            git diff --cached --quiet && exit 0
            git commit -q -m "busca #${{ github.event.issue.number }}"
            git pull --rebase -q origin main && git push -q && exit 0
            git rebase --abort 2>/dev/null; git reset -q --soft origin/main; sleep 5
          done
          exit 1

      - name: Responder e fechar a issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          [ -f comentario.md ] || echo "Não consegui processar o pedido." > comentario.md
          gh issue comment "$NUM" --repo "${{ github.repository }}" --body-file comentario.md
          gh issue close "$NUM" --repo "${{ github.repository }}"
