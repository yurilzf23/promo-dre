name: Promo Dre

on:
  schedule:
    - cron: "17 */2 * * *"   # coleta a cada 2 horas e atualiza o site
  push:                      # quando o PC sobe a coleta da Pichau, só regenera o site
    branches: [main]
    paths: ["data/historico_pc.csv", "data/imagens_pc.json"]
  workflow_dispatch:
    inputs:
      tarefa:
        description: "coletar ou site"
        default: coletar

permissions:
  contents: write

concurrency:
  group: promo-dre
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Definir tarefa
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tarefa=${{ github.event.inputs.tarefa }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tarefa=site" >> "$GITHUB_OUTPUT"
          else
            echo "tarefa=coletar" >> "$GITHUB_OUTPUT"
          fi

      - name: Executar
        if: steps.t.outputs.tarefa == 'coletar'
        # a Pichau bloqueia os servidores do GitHub; ela é coletada pelo PC (coletar_pc.bat)
        run: python -m promodre.main coletar --sem pichau

      - name: Salvar histórico e site
        run: |
          git config user.name "promo-dre-bot"
          git config user.email "promo-dre-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -q -m "${{ steps.t.outputs.tarefa }} $(date -u +%Y-%m-%dT%H:%MZ)"
          # o site é sempre regenerado DEPOIS de puxar o que mudou no repositório,
          # assim o docs/dados.json nunca entra em conflito (até 3 tentativas)
          for tentativa in 1 2 3; do
            git pull --rebase -q -X theirs origin main
            python -m promodre.main site
            git add docs/
            git diff --cached --quiet || git commit -q -m "site $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q; then exit 0; fi
            echo "push recusado, tentando de novo ($tentativa)"; sleep 5
          done
          exit 1
