name: Promo Dre

on:
  schedule:
    - cron: "17 */2 * * *"   # coleta a cada 2 horas
    - cron: "41 11 * * *"    # resumo diário às 08:41 (horário de Brasília)
  workflow_dispatch:
    inputs:
      tarefa:
        description: "coletar, resumo ou testar"
        default: coletar

permissions:
  contents: write

concurrency:
  group: promo-dre
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Definir tarefa
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tarefa=${{ github.event.inputs.tarefa }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "41 11 * * *" ]; then
            echo "tarefa=resumo" >> "$GITHUB_OUTPUT"
          else
            echo "tarefa=coletar" >> "$GITHUB_OUTPUT"
          fi

      - name: Executar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.t.outputs.tarefa }}" = "coletar" ]; then
            # a Pichau bloqueia os servidores do GitHub; ela é coletada pelo PC (coletar_pc.bat)
            python -m promodre.main coletar --sem pichau
          else
            python -m promodre.main ${{ steps.t.outputs.tarefa }}
          fi

      - name: Salvar histórico
        if: steps.t.outputs.tarefa == 'coletar'
        run: |
          git config user.name "promo-dre-bot"
          git config user.email "promo-dre-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "coleta $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main
          git push
